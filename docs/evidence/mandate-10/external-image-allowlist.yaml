  # The AIO02 entry below runs in techx-tf3, so the policy judges it, but AIO02
  # owns its release cycle. It sits here rather than under the first-party
  # policy for two reasons, both re-verified on 2026-07-30: that policy requires
  # a CycloneDX attestation build-push-copilot.yml does not emit, and that
  # workflow installs Cosign v3, whose OCI 1.1 referrers layout leaves no
  # sha256-<digest>.sig tag for Kyverno's verifyImages to read.
  #
  # A version bump that forgets this file fails the drift check on the pull
  # request instead of rejecting pods at admission - but only since the gate was
  # wired to gitops/ and the chart. Before that it never ran on a bump, which is
  # how 2a79781b reached the cluster uncatalogued.
