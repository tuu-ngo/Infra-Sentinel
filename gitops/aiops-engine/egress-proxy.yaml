apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-egress-proxy
  namespace: techx-tf3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-egress-proxy-config
  namespace: techx-tf3
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  egress-proxy.yaml: |
    static_resources:
      listeners:
        - name: aiops_https_forward_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 3128
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: aiops_egress_proxy
                    http_protocol_options:
                      accept_http_10: true
                    upgrade_configs:
                      - upgrade_type: CONNECT
                    route_config:
                      name: aiops_egress_proxy_route
                      virtual_hosts:
                        - name: aiops_external_https
                          domains:
                            - "*"
                          routes:
                            - match:
                                connect_matcher: {}
                              route:
                                cluster: dynamic_forward_proxy_cluster
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                    http_filters:
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              aiops_reviewed_external_https:
                                permissions:
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              exact: hooks.slack.com:443
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              exact: slack.com:443
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              exact: api.slack.com:443
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^sts\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^sts\.ap-southeast-1\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^s3\.ap-southeast-1\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^tf3-aiops-models-197826770971\.s3\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^tf3-aiops-models-197826770971\.s3\.ap-southeast-1\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^bedrock-runtime\.us-east-1\.amazonaws\.com(?::443)?$'
                                  - and_rules:
                                      rules:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: CONNECT
                                        - header:
                                            name: ":authority"
                                            string_match:
                                              safe_regex:
                                                google_re2: {}
                                                regex: '^bedrock-agent-runtime\.us-east-1\.amazonaws\.com(?::443)?$'
                                principals:
                                  - any: true
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config:
                            name: aiops_external_dns_cache
                            dns_lookup_family: V4_ONLY
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: dynamic_forward_proxy_cluster
          connect_timeout: 5s
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config:
                name: aiops_external_dns_cache
                dns_lookup_family: V4_ONLY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-egress-proxy
  namespace: techx-tf3
  labels:
    app.kubernetes.io/name: aiops-egress-proxy
    app.kubernetes.io/component: aiops-egress-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-egress-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-egress-proxy
        app.kubernetes.io/component: aiops-egress-proxy
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-30T22:42:43+07:00'
    spec:
      serviceAccountName: aiops-egress-proxy
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.34.10@sha256:3343a698c1bdfdbb174f1bd907dea789d728692f4f99a943e3e6f0bc5ef6513f
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/envoy
          args:
            - -c
            - /etc/envoy/egress-proxy.yaml
            - --log-level
            - info
          ports:
            - name: http-proxy
              containerPort: 3128
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3128
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy/egress-proxy.yaml
              subPath: egress-proxy.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: envoy-config
          configMap:
            name: aiops-egress-proxy-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-egress-proxy
  namespace: techx-tf3
  labels:
    app.kubernetes.io/name: aiops-egress-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  type: ClusterIP
  clusterIP: 172.20.255.150
  selector:
    app.kubernetes.io/name: aiops-egress-proxy
  ports:
    - name: http-proxy
      port: 3128
      targetPort: 3128
      protocol: TCP
