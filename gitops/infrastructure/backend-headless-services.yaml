# email là hop HTTP (không phải gRPC) của checkout, nhưng dính đúng một bệnh:
# Go `http.Transport` giữ connection pool theo host, và pool tới một ClusterIP sẽ
# ghim vào một pod email. Đó là lý do hàng đợi email dựng lên tới 15s (span client
# `POST` p95 = 15000ms trong khi span server của email chỉ 391ms) — và là lý do
# nâng replica email lên 2..8 ở PR #656 vẫn chưa đủ nếu traffic không tới được.
#
# Khác gRPC, Go phân giải DNS cho MỖI kết nối mới, nên chỉ cần trỏ EMAIL_ADDR vào
# headless là pool tự trải ra nhiều pod — không cần sửa code checkout.
apiVersion: v1
kind: Service
metadata:
  name: email-headless
  namespace: techx-tf3
  labels:
    mandate-19.techx.io/purpose: http-client-side-lb
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    opentelemetry.io/name: email
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
