# Mandate #2 (Cost + Reliability): HPA cho các service hot path browse+checkout.
# techx-infrastructure-app (ArgoCD) sync file này.
#
# minReplicas: 2 khớp REL-01 (baseline chống SPOF). maxReplicas có trần để không
# scale vô hạn vượt quota/ngân sách. Target CPU 65% giúp phản ứng sớm trong flash sale.
# Node burst do Karpenter Spot xử lý khi pod Pending; scaleDown giữ 2 phút để co xuống
# nhanh sau đỉnh nhưng không flap quá mạnh.
#
# Yêu cầu: metrics-server EKS add-on + CPU requests tường minh trong workload.
# KHÔNG đặt HPA cho datastore (stateful).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-proxy-hpa
  namespace: techx-tf3
  annotations:
    # Mandate-19 capacity step (30/07/2026): proxy đạt 70%/65% ở 7/8 replica tại
    # stage vỡ 1400 user — sát trần. Nới 8 -> 12 để proxy không thành nút thắt
    # kế tiếp sau khi frontend được nới. Đo: docs/evidence/mandate-19/real-2026-07-30/
    mandate-19.techx.io/capacity-step: "2026-07-30"
spec:
  scaleTargetRef:
    { apiVersion: apps/v1, kind: Deployment, name: frontend-proxy }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: techx-tf3
  annotations:
    # PM-153 (Mandate-19): PM-152 found frontend CPU saturation first at the
    # 410-user failing stage. The higher target packs more work on each existing
    # node. This staged PR changes only the CPU request/target; raise maxReplicas
    # in a separately measured capacity step after the 65% target is validated.
    #
    # Mandate-19 capacity step — ĐÂY là bước đo đã hứa ở trên (30/07/2026).
    # Đo exact-window trên node-set cố định 9 node (hash 54755c311f1a64b9),
    # generator ngoài cluster (scripts/mandate-19/):
    #   1000 user (trần): frontend 112%/65% ở 8/8 replica  — ĐỤNG TRẦN maxReplicas
    #   1400 user (vỡ):   frontend 128%/65% ở 8/8 replica  — vẫn đụng trần
    # Trong khi đó CPU node cao nhất chỉ 60% và 2 node gần rỗng (1%, 7%).
    # Nghĩa là trần thông lượng bị chặn bởi maxReplicas, KHÔNG bởi capacity node.
    # Nới 8 -> 16 để HPA dùng được phần CPU node đang bỏ không. Không thêm node.
    mandate-19.techx.io/capacity-step: "2026-07-30"
    mandate-19.techx.io/evidence: "docs/evidence/mandate-19/real-2026-07-30/"
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  # REL-21 (Mandate-21): 2 -> 3. topologySpread zone (maxSkew=1 DoNotSchedule) chỉ áp
  # LÚC SCHEDULE; K8s KHÔNG rebalance khi HPA scale-down. Với min=2, một lần scale-down
  # xoá đúng pod ở AZ thiểu số -> cả 2 replica dồn 1 AZ (đã thấy 30/07: 2/2 ở 1c). Mất
  # AZ đó là storefront sập. Với elastic chỉ ở 2 AZ (1a+1c), min=3 luôn rải 2+1 (3+0 vi
  # phạm maxSkew nên không xảy ra) -> mất bất kỳ AZ nào vẫn còn >=1 replica, kể cả sau
  # scale-down. Fix gốc rễ (descheduler / elastic AZ thứ 3) theo dõi riêng.
  minReplicas: 3
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
---
