apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-hpa
  namespace: techx-tf3
spec:
  # checkout now migrates through checkout-rollout. Target the Rollout scale
  # subresource so HPA retains REL-01's minReplicas=2 during each canary step.
  #
  # Mandate-19 capacity step (30/07/2026): checkout là nguồn của lỗi người dùng
  # thấy nhiều nhất khi vượt trần. Đo trên node-set cố định 9 node:
  #   1000 user: checkout 64%/65% ở 5/8   -> checkout client-side 99,89% OK
  #   1400 user: checkout 89%/65% ở 8/8   -> 3.912/5.526 checkout trả 504 (29,2% OK)
  #   1800 user: 8/8                      -> 6.465/6.961 trả 504 (7,1% OK)
  # 504 sinh ra khi latency checkout vượt route timeout mặc định 15s của Envoy
  # (checkout p95/p99 đo được ghim đúng 15000ms = bucket histogram cao nhất).
  # Nới 8 -> 14 để checkout còn scale được trước khi đụng timeout. Không thêm node.
  scaleTargetRef:
    { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: checkout-rollout }
  minReplicas: 2
  maxReplicas: 14
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
---
