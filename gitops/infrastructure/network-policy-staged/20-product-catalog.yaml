apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-catalog-business-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,flagd=172.20.213.30,otel-gateway=172.20.117.175"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: product-catalog
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: checkout
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: recommendation
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: product-reviews
        - podSelector:
            matchLabels:
              app: shopping-copilot
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flagd
        - ipBlock:
            cidr: 172.20.213.30/32
      ports:
        - { protocol: TCP, port: 8013 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-gateway
        - ipBlock:
            cidr: 172.20.117.175/32
      ports:
        - { protocol: TCP, port: 4317 }
    - to:
        - ipBlock: { cidr: 10.0.0.0/20 }
        - ipBlock: { cidr: 10.0.16.0/20 }
        - ipBlock: { cidr: 10.0.32.0/20 }
      ports:
        - { protocol: TCP, port: 5432 }
