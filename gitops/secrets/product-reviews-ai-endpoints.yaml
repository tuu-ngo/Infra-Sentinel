# Endpoint URLs are non-secret values, but External Secrets provides the
# Terraform-to-GitOps handoff without committing AWS-generated VPCE hostnames.
# The Product Reviews rollout remains pending, with old Ready pods serving,
# until Terraform creates both parameters and ESO creates the target Secret.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: product-reviews-ai-endpoints
  namespace: techx-tf3
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-parameter-store
  target:
    name: product-reviews-ai-endpoints
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: sts_url
      remoteRef:
        key: /techx-corp-tf3/product-reviews/ai-endpoints/sts-url
    - secretKey: bedrock_runtime_url
      remoteRef:
        key: /techx-corp-tf3/product-reviews/ai-endpoints/bedrock-runtime-url
