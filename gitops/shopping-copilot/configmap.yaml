# Non-secret runtime config for shopping-copilot.
#
# ⚠️ Deviations from AIO02's DEPLOYMENT-SPEC k8s-deployment.yaml (which was written against
# the PRE-Mandate-#8 world) - all deliberate:
#   * NO DB_PASSWORD / DB_CONNECTION_STRING here. The old spec hardcoded password=otelp in a
#     tracked ConfigMap+Secret; committing real secret values is a disqualify-level rule for
#     TF3. DB creds come from the RDS-managed ExternalSecret techx-tf3-postgres-conn, injected
#     as DB_CONNECTION_STRING in deployment.yaml.
#   * DB_HOST / VALKEY point at the MANAGED stores (RDS + ElastiCache), not the in-cluster
#     postgresql/valkey-cart Services - those were turned off in Mandate #8 §8 and no longer
#     resolve. VALKEY_URL is a secret (rediss:// with auth token) injected in deployment.yaml.
#   * CORS locked to the Cloudflare Access hostname instead of "*".
# The gRPC/HTTP microservices below ARE still in-cluster (app tier, not datastores).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopping-copilot-config
  namespace: techx-tf3
  labels:
    app: shopping-copilot
data:
  # ── LLM backend (Bedrock, APAC inference profile) ────────────────
  BEDROCK_MODEL_ID: "apac.amazon.nova-lite-v1:0"
  BEDROCK_REGION: "ap-southeast-1"

  # ── Guardrails ───────────────────────────────────────────────────
  BEDROCK_GUARDRAIL_ID: "3ab7r29x59x4"
  BEDROCK_GUARDRAIL_VERSION: "DRAFT"
  BEDROCK_GUARDRAIL_REGION: "us-east-1"

  # ── RAG Knowledge Base ───────────────────────────────────────────
  BEDROCK_KB_ID: "UCTITOWFHE"
  # KB techx-products-kb-v2 (UCTITOWFHE) is ACTIVE in us-east-1, NOT ap-southeast-1 (verified
  # 2026-07-27). The app's kb_client reads BEDROCK_KB_REGION (separate from BEDROCK_REGION);
  # pin it explicitly so Retrieve() hits the right region regardless of the LLM region.
  BEDROCK_KB_REGION: "us-east-1"
  BEDROCK_KB_DATA_SOURCE_ID: "OJQNE88GXV"
  REVIEWS_DATA_SOURCE_ID: "M2YA7L7GEA"
  PRODUCTS_S3_BUCKET: "techx-products-catalog-2026"

  # ── Database (RDS PostgreSQL - Mandate #8) ───────────────────────
  # Host/port/name only, for any code path that reads them individually. The authoritative
  # credentialed DSN is DB_CONNECTION_STRING, injected from Secret in deployment.yaml.
  DB_HOST: "techx-tf3-postgres.czwcs2ocww3q.ap-southeast-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "otel"
  DB_SSLMODE: "require"

  # ── gRPC / HTTP microservices (in-cluster app tier) ──────────────
  CATALOG_ADDR: "product-catalog.techx-tf3.svc.cluster.local:8080"
  CART_ADDR: "cart.techx-tf3.svc.cluster.local:8080"
  REVIEWS_ADDR: "product-reviews.techx-tf3.svc.cluster.local:3551"
  RECO_ADDR: "recommendation.techx-tf3.svc.cluster.local:8080"
  CURRENCY_ADDR: "currency.techx-tf3.svc.cluster.local:8080"
  SHIPPING_ADDR: "http://shipping.techx-tf3.svc.cluster.local:8080"

  # ── Egress (Mandate #17: no direct public egress from the workload) ──
  # botocore honours HTTPS_PROXY, so every AWS call (Bedrock, Bedrock Agent, STS) goes out via
  # CONNECT through the copilot's own proxy, which allowlists the exact authorities.
  # Only HTTPS_PROXY is set - HTTP_PROXY would also capture the plain-http in-cluster call to
  # shipping. NO_PROXY additionally exempts cluster-local names for any client that reads it.
  HTTPS_PROXY: "http://shopping-copilot-egress-proxy.techx-tf3.svc.cluster.local:3128"
  NO_PROXY: "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local,10.0.0.0/8,172.20.0.0/16"

  # ── Mandate-23 GenAI semantic cache (AIE2 copilot update) ────────
  # Tier-2 lookup embeds the query with amazon.titan-embed-text-v2:0; the IRSA role allows
  # that model (shopping-copilot-bedrock.tf). Left ON - it cuts repeat Bedrock calls, which
  # is what bounds LLM spend on a public endpoint.
  TITAN_SEMANTIC_CACHE: "true"

  # ── Session store strictness ─────────────────────────────────────
  # Set explicitly rather than relying on the code default. "true" = if Valkey is
  # unreachable the app RAISES instead of falling back to a per-pod JSON file. That is the
  # right call here (a file fallback would silently split sessions across the 2 replicas and
  # lose long-term memory), but it does turn a Valkey blip into failed chat requests rather
  # than degraded ones. Flip to "false" during a Valkey incident to trade correctness for
  # availability. Note: BEDROCK_FALLBACK_MODEL_ID is deliberately NOT set - a fallback model
  # would also need adding to the IRSA policy first.
  STRICT_VALKEY: "true"

  # ── App ──────────────────────────────────────────────────────────
  # SSO hostname + the public storefront (embedded widget calls /api/copilot/* same-origin
  # via Envoy, so CORS is not strictly required, but list the storefront for any direct call).
  CORS_ALLOWED_ORIGINS: "https://copilot.arthur-ngo.org,https://d2tn71186d7ilz.cloudfront.net"
  LOG_LEVEL: "INFO"
