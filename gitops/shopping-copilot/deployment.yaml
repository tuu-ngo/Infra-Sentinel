# Shopping Copilot Deployment.
#
# ⚠️ IMAGE IS DIGEST-PINNED (PM-101). The placeholder below MUST be replaced with the real
# digest emitted by .github/workflows/build-push-copilot.yml before this app is allowed to
# sync - until then the pod stays ImagePullBackOff (harmless to other services). Never pin a
# mutable tag like :v1.0.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-copilot
  namespace: techx-tf3
  labels:
    app: shopping-copilot
    app.kubernetes.io/part-of: techx-corp
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # keep full capacity during rollout (REL-01 / Mandate #3 posture)
      maxSurge: 1
  selector:
    matchLabels:
      app: shopping-copilot
  template:
    metadata:
      annotations:
        # BUMP THIS whenever configmap.yaml changes. These are plain manifests, so there is no
        # Helm-style checksum: ArgoCD would update the ConfigMap without rolling the pods, and
        # envFrom values are only read at container start - so the new config silently never
        # takes effect. That is exactly what happened with HTTPS_PROXY (chat returned 504 until
        # a manual `kubectl rollout restart`). Changing this annotation changes the pod
        # template, so ArgoCD performs a normal rolling update instead.
        techx.io/configmap-revision: "3"
      labels:
        app: shopping-copilot
        app.kubernetes.io/part-of: techx-corp
    spec:
      serviceAccountName: shopping-copilot-sa
      # UID 1000 matches the image's `appuser` (Dockerfile `useradd -m appuser`), which owns
      # /app. The app writes uvicorn_execution.txt to WORKDIR /app and session/cache files to
      # /app/data at import/runtime - forcing a different UID (e.g. 10001) makes that a
      # PermissionError and crashes the pod on startup. Numeric UID also satisfies runAsNonRoot.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Spread the 2 replicas across zones AND hosts so a single node/AZ loss can't take
      # both down (matches how we made the other HA pairs survive drains).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shopping-copilot
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: shopping-copilot
      containers:
        - name: shopping-copilot
          image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/shopping-copilot@sha256:2a79781bed10b259a4b19cf099d08ec5ba9fb05f0ae3e2ca927b783ce6b90fb1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: shopping-copilot-config
          env:
            # connect.py reads DB_USER/DB_PASSWORD individually (NOT a DSN), so inject the
            # RDS-managed master creds as discrete env vars. DB_HOST/PORT/NAME/SSLMODE come
            # from the ConfigMap (RDS host, sslmode=require).
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: shopping-copilot-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopping-copilot-db
                  key: password
            # Titan embed region for the semantic cache (genai_cache reads AWS_DEFAULT_REGION
            # directly, default us-east-1). MUST be declared here in env[], NOT in the
            # ConfigMap: the EKS Pod Identity webhook injects AWS_DEFAULT_REGION=ap-southeast-1
            # into env[], and env[] overrides envFrom - so a ConfigMap value is ignored, but a
            # value the container already declares makes the webhook skip injection. Titan
            # (amazon.titan-embed-text-v2:0) only exists in us-east-1. AWS_REGION is left to the
            # webhook (ap-southeast-1), so every other boto3 client stays regional there.
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            # ElastiCache Valkey URL: rediss:// with auth token, rendered by ExternalSecret.
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: shopping-copilot-valkey-url
                  key: url
            # HMAC key for the write-confirmation gate (add-to-cart). Without it the app
            # falls back to a predictable hardcoded default -> forgeable confirm tokens.
            # Created out of band (never in git); see the deploy runbook.
            - name: COPILOT_CONFIRMATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopping-copilot-confirmation
                  key: secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      # Session/cache file fallback path (used only if Valkey is unreachable). Ephemeral;
      # per-replica, so it is not shared - rely on Valkey for shared sessions.
      volumes:
        - name: data
          emptyDir: {}
