otel-node-agent:
  enabled: true
  namespaceOverride: observability-system
  fullnameOverride: otel-node
  nameOverride: otel-node-agent
  mode: daemonset
  revisionHistoryLimit: 5
  image:
    repository: "otel/opentelemetry-collector-contrib"
    tag: "0.151.0"
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: otel-node-agent
    automountServiceAccountToken: true
  clusterRole:
    # PR1 (mandate05 otel parity): create:true de chart tu sinh du RBAC theo
    # preset dang bat (clusterMetrics can quyen doc rong + Lease de leader-elect,
    # giong het otel-collector-agent cu - xem gitops evidence
    # docs/docx_cdo01/mandate05/karpenter-elastic-batch2-batch3-20260722.md).
    create: true
    name: otel-node-agent
    clusterRoleBinding:
      name: otel-node-agent
  service:
    enabled: false
  ports:
    otlp:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
  presets:
    hostMetrics:
      enabled: true
    kubeletMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
    # PR1 (mandate05 otel parity): bat k8s_cluster receiver + k8s_leader_elector,
    # dung dung preset co san cua chart (khong tu viet raw OTel config) - copy
    # nguyen cach otel-collector-agent cu da lam. Leader election dam bao chi 1/7
    # pod thuc su bao cao metric cluster-wide (k8s_deployment_available,
    # k8s_namespace_phase...), khong bi 7 pod bao trung.
    clusterMetrics:
      enabled: true
    # PR2 (mandate05 otel parity): bat receiver_creator/metrics + extension
    # k8s_observer, dung preset co san - copy nguyen cach otel-collector-agent
    # cu da lam. Phuc vu dung 3 pod dang phu thuoc annotation
    # prometheus.io/scrape=true de tu-phat-hien: aws-load-balancer-controller
    # (2 replica, kube-system) va jaeger (techx-tf3) - da xac nhan bang
    # `kubectl get pods -A -o json` loc annotation nay, xem
    # docs/docx_cdo01/mandate05/karpenter-elastic-batch2-batch3-20260722.md.
    # Chi bat metrics, KHONG bat logs (agent nay khong lam logs pipeline).
    annotationDiscovery:
      metrics:
        enabled: true
      logs:
        enabled: false
    logsCollection:
      enabled: false
  rollout:
    strategy: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 30
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  alternateConfig:
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    receivers: {}
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resourcedetection:
        detectors: [env, system]
      resource:
        attributes:
          - key: telemetry.role
            value: node-agent
            action: upsert
      batch: {}
    exporters:
      otlphttp/prometheus:
        endpoint: http://prometheus.techx-tf3.svc.cluster.local:9090/api/v1/otlp
        tls:
          insecure: true
        sending_queue:
          batch: {}
        retry_on_failure:
          enabled: true
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: []
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [otlphttp/prometheus]
      telemetry:
        metrics:
          level: detailed

jaeger:
  enabled: true
  fullnameOverride: jaeger
  jaeger:
    storage:
      type: memory
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "25000"
      - name: PROMETHEUS_ADDR
        value: prometheus:9090
      # PR3 (mandate05 otel parity): jaeger khong nam trong `components:` nen
      # khong tu dong doi theo default.env.OTEL_COLLECTOR_NAME nhu 18 service
      # khac (PR #301) - day la ly do duy nhat jaeger van tu gui trace/metric
      # ve otel-collector-agent cu (da xac nhan qua Prometheus, service_name=
      # jaeger). Doi tay sang otel-gateway de dong bo voi kien truc moi.
      - name: OTEL_COLLECTOR_HOST
        value: otel-gateway
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"
      - name: JAEGER_GRPC_PORT
        value: "4317"
    resources:
      limits:
        memory: 600Mi
    podSecurityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      fsGroup: 10001
    securityContext:
      runAsUser: 10001
      runAsGroup: 10001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  userconfig:
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
      telemetry:
        resource:
          service.name: jaeger
        metrics:
          level: detailed
          readers:
            - periodic:
                interval: 10000
                timeout: 5000
                exporter:
                  otlp:
                    protocol: http/protobuf
                    endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
                    insecure: true
        logs:
          level: info
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memory_backend
          metrics: metrics_backend
        base_path: /jaeger/ui
      jaeger_storage:
        backends:
          memory_backend:
            memory:
              max_traces: ${env:MEMORY_MAX_TRACES}
        metric_backends:
          metrics_backend:
            prometheus:
              endpoint: "http://${env:PROMETHEUS_ADDR}"
              normalize_calls: true
              normalize_duration: true

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:JAEGER_HOST}:${env:JAEGER_GRPC_PORT}

    processors:
      batch: {}

    exporters:
      jaeger_storage_exporter:
        trace_storage: memory_backend

prometheus:
  enabled: true
  # Directive #18 A4 - metric cardinality. The kubernetes-api-servers scrape job alone is
  # ~56% of all active series (measured 131k / 237k), almost entirely apiserver/etcd
  # latency+size histogram buckets that no storefront SLO or cluster-ops dashboard reads.
  # Drop the _bucket series (keeping _count/_sum, so request/error rates and averages
  # survive) plus the kubelet buckets. scrapeConfigs is a keyed map in the subchart, so
  # this deep-merges: it only adds metric_relabel_configs to these two jobs and leaves the
  # other eight scrape jobs (and each job's relabel/SD config) untouched. Validated with
  # promtool. cadvisor is deliberately left alone - dashboards use its container_* gauges.
  scrapeConfigs:
    kubernetes-api-servers:
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: '(apiserver|etcd)_.*_bucket'
          action: drop
    kubernetes-nodes:
      metric_relabel_configs:
        - source_labels: [__name__]
          regex: 'kubelet_.*_bucket'
          action: drop
  alertmanager:
    enabled: false
  configmapReload:
    prometheus:
      enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    fullnameOverride: prometheus
    extraFlags:
      - "enable-feature=exemplar-storage"
      - "web.enable-otlp-receiver"
    retention: 7d
    tsdb:
      out_of_order_time_window: 30m
    otlp:
      keep_identifying_resource_attributes: true
      # Recommended attributes to be promoted to labels.
      promote_resource_attributes:
        - service.instance.id
        - service.name
        - service.namespace
        - service.version
        - cloud.availability_zone
        - cloud.region
        - deployment.environment.name
        # When deploying on Kubernetes, resource attributes used to identify the
        # kubernetes resources in dashboards and alerts.
        - k8s.cluster.name
        - k8s.container.name
        - k8s.cronjob.name
        - k8s.daemonset.name
        - k8s.deployment.name
        - k8s.job.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.name
        - k8s.replicaset.name
        - k8s.statefulset.name
        - container.name
        # When deploying on VMs, resource attributes used to identify
        # the host in dashboards and alerts.
        - host.name
        # PostgreSQL resource attributes produced by the OTel Collector PostgreSQL receiver
        # and used in dashboards and alerts.
        # See https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/receiver/postgresqlreceiver/metadata.yaml
        - postgresql.database.name
        - postgresql.schema.name
        - postgresql.table.name
        - postgresql.index.name
    persistentVolume:
      enabled: false
    service:
      servicePort: 9090
    resources:
      limits:
        memory: 400Mi
    containerSecurityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

grafana:
  enabled: true
  fullnameOverride: grafana
  rbac:
    create: true
    namespaced: true
  testFramework:
    enabled: false
  grafana.ini:
    auth:
      disable_login_form: false
    auth.anonymous:
      enabled: false
      org_name: Main Org.
      org_role: Viewer
    server:
      root_url: "%(protocol)s://%(domain)s:%(http_port)s/grafana"
      serve_from_sub_path: true
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  plugins:
    - grafana-opensearch-datasource
  sidecar:
    securityContext:
      runAsUser: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
    alerts:
      enabled: true
    dashboards:
      enabled: true
    datasources:
      enabled: true
    resources:
      limits:
        cpu: 150m
        memory: 256Mi
  resources:
    limits:
      memory: 300Mi
  containerSecurityContext:
    runAsUser: 472
    runAsGroup: 472
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# Directive #18 A2 - external retention for OpenSearch log indices. See
# templates/otel-logs-retention-cronjob.yaml for why this is a stateless CronJob
# rather than an in-cluster ISM policy (OpenSearch runs on emptyDir here).
otelLogsRetention:
  enabled: true
  # Daily at 01:30; low-traffic window.
  schedule: "30 1 * * *"
  # Keep this many days of daily otel-logs-* indices; older ones are deleted.
  retentionDays: 7
  indexPrefix: otel-logs
  opensearchEndpoint: http://opensearch:9200
  # Reuse the exact image the OpenSearch pod already runs (has curl + date, already
  # vetted/pulled) so no new supply-chain surface is introduced. Keep digest-pinned.
  image: opensearchproject/opensearch@sha256:b5dd1512af2a99748c942cfbbd7f32162623336b210667d0fc6333c6321f171d

opensearch:
  enabled: true
  fullnameOverride: opensearch
  clusterName: demo-cluster
  nodeGroup: techx-corp
  singleNode: true
  opensearchJavaOpts: "-Xms400m -Xmx400m"
  persistence:
    enabled: false
  extraEnvs:
    - name: "bootstrap.memory_lock"
      value: "true"
    - name: "DISABLE_INSTALL_DEMO_CONFIG"
      value: "true"
    - name: "DISABLE_SECURITY_PLUGIN"
      value: "true"
  resources:
    limits:
      memory: 1100Mi
